# Tema del dashboard (pedido del usuario): pantalla principal con gris muy
# tenue, panel de filtros (sidebar) en blanco como estaba.
# compresión del websocket: los árboles HTML grandes pasan de ~10MB a <1MB y
# dejan de tirar la conexión (WebSocketClosedError en consola).
[server]
enableWebsocketCompression = true

[theme]
base = "light"
backgroundColor = "#eef0f3"
secondaryBackgroundColor = "#ffffff"
primaryColor = "#a93226"
# 2026-07-24: st.dataframe (Streamlit 1.50) se dibuja sobre <canvas> vía
# glide-data-grid — ningún CSS (thead th, [data-testid=stDataFrame] ...)
# puede tocar su encabezado, solo lo que exponga el tema. textColor asegura
# que el texto (incl. encabezados) sea carbón legible en vez del gris default;
# dataframeHeaderBackgroundColor le da al encabezado un fondo distinguible
# del resto de la tabla (antes usaba el mix automático, casi imperceptible).
textColor = "#2b2b2b"
dataframeHeaderBackgroundColor = "#dde1e6"
